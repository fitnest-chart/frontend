apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.fullname" . }}-sa
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default .Values.service.port }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: vault-approle-secret
                  key: role-id
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: vault-approle-secret
                  key: secret-id
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | default "https://vault.fitnest.az" | quote }}
            - name: VAULT_SECRET_PATH
              value: {{ printf "landing-frontend/%s" (.Values.vaultEnv | default "development") | quote }}
          {{- end }}
          {{- if .Values.assetLinks.enabled }}
          volumeMounts:
            - name: assetlinks
              mountPath: /app/public/.well-known/assetlinks.json
              subPath: assetlinks.json
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Probe paths verified live against this service before rollout.
          # The JVM needs time to boot; the startup probe holds the other two off so a
          # slow start is not mistaken for a crash loop.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      {{- if .Values.assetLinks.enabled }}
      volumes:
        - name: assetlinks
          secret:
            secretName: {{ .Values.assetLinks.secretName }}
      {{- end }}