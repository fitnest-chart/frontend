{{- if .Values.istio.enabled}}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "frontend.fullname" . }}-vs
  labels:
    {{- include "frontend.labels" . | nindent 4}}
spec:
  gateways:
    - {{ .Values.istio.gateway.name}}
  hosts:
    {{- toYaml .Values.istio.virtualService.hosts | nindent 4}}
  http:
    - match:
      {{- range .Values.istio.virtualService.paths}}
      - uri:
          prefix: {{ .}}
      {{- end}}
      route:
        - destination:
            host: {{ include "frontend.fullname" .}}
            port:
              number: {{ .Values.service.port}}
{{- end}}
